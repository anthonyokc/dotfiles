# Rebinding the tmux prefix key
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix
# unbind-key -a
set -g prefix ^A

bind R source-file ~/.tmux.conf # Source the tmux config file
bind r command-prompt "rename-window %%"
bind : command-prompt

# session management
bind ^D detach
bind S choose-session # present an interactive interface to the user for selecting a session to attach to.
bind M-X lock-server # allows you to lock your tmux session, preventing unauthorized access.
bind * list-clients # This command is used to list all clients currently connected to the tmux server.
bind ^L refresh-client # redraw the current client's screen. This can be useful if your tmux window becomes out of sync with the actual display
bind l refresh-client
bind n switch-client -l
bind -n M-q kill-session

# window management
bind w new-window
bind N next-window
bind ^A last-window
bind ^W list-windows
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window
bind ^X kill-window

# pane management
bind j select-pane -D
bind k select-pane -U
# bind h select-pane -L # conflict with sesh scripts below
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind z resize-pane -Z
bind * setw synchronize-panes
bind c kill-pane
bind X swap-pane -D


# sesh session manager
bind-key "f" display-popup -E -w 50% "$HOME/scripts/find_repo_directory_and_connect_with_sesh"
bind-key "t" display-popup -EE -w 70% -h 75% -d "#{pane_current_path}" "$HOME/scripts/find_worktree_and_connect_with_sesh"
bind-key "T" display-popup -EE -w 70% -h 75% -d "#{pane_current_path}" "$HOME/scripts/find_worktree_or_create_from_branch_and_connect_with_sesh"
bind-key "C-p" display-popup -E -w 80% -h 75% -b rounded -T "🤖 ccmux" "ccmux"
bind-key "S" run-shell "ccmux sidebar --toggle"

bind-key "F" run-shell "sesh connect \"$(
    sesh list | fzf-tmux -p 80%,80% \
        --no-sort --border-label ' sesh ' --prompt '⚡  ' \
        --header '  ^a all ^t tmux ^g configs ^x zoxide ^e tmux kill ^f find' \
        --bind 'tab:down,btab:up' \
        --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list)' \
        --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
        --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c)' \
        --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z)' \
        --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d --ignore-file ~/.ignore . ~/code)' \ # searches code directories
        --bind 'ctrl-e:execute(tmux kill-session -t {})+change-prompt(⚡  )+reload(sesh list)'
)\""

# -E flag makes sure the environment variables are preserved in the popup
# -w flag sets the width of the popup
bind-key "h" display-popup -E -w 61% "zsh -c 'source $HOME/.zprofile; $HOME/scripts/find_and_open_repo_in_browser'"
bind-key "H" display-popup -E -w 61% "zsh -c 'source $HOME/.zprofile; $HOME/scripts/find_and_clone_repo_and_connect_with_sesh'"
bind-key "o" display-popup -E -w 61% "zsh -c 'source $HOME/.zprofile; $HOME/scripts/create_new_repo_and_connect_with_sesh'"

# -d flag sets the starting directory of the popup to the current pane's path, required for these scripts to work correctly
# -b flag adds rounded borders to the popup
bind-key "m" display-popup -E -w 50% -b rounded -d "#{pane_current_path}" "zsh -ic 'source $HOME/.zprofile; $HOME/scripts/create_conventional_commit_ai_message'"

# Open developer tools in new tmux windows
bind-key "g" new-window -c "#{pane_current_path}" -n "😴 LazyGit" "lazygit 4> /dev/null"
bind-key "G" new-window -c "#{pane_current_path}" -n "📝 tuicr" "tuicr 3> /dev/null"
bind-key "i" new-window -c "#{pane_current_path}" -n "📄 Docs" "docs 3> /dev/null"
bind-key "I" new-window -c "#{pane_current_path}" -n "🍺 Taproom" "taproom 3> /dev/null"
bind-key "u" new-window -c "#{pane_current_path}" -n "🗄️ Yazi" "yazi 4> /dev/null"
bind-key "O" new-window -n "😺 GitHub Dash" "gh dash $HOME 3> /dev/null"
bind-key "q" new-window -c "#{pane_current_path}" -n "🤖 OpenCode" "OPENCODE_CONFIG_CONTENT='{\"agent\":{\"build-local\":{\"tools\":{\"*\":false,\"bash\":true,\"read\":true,\"glob\":true,\"grep\":true,\"apply_patch\":true,\"todowrite\":true,\"notion_*\":true}}}}' opencode 3> /dev/null"
bind-key "Q" new-window -c "#{pane_current_path}" -n "🤖 OpenCode + Exa" "OPENCODE_ENABLE_EXA=1 OPENCODE_CONFIG_CONTENT='{\"permission\":{\"websearch\":\"ask\",\"webfetch\":\"ask\"}}' opencode 2> /dev/null"
bind-key "W" new-window -c "#{pane_current_path}" -n "🤖 OpenCode + Notion" "$HOME/scripts/opencode-notion 3> /dev/null"
bind-key "D" new-window -c "#{pane_current_path}" -n "🗄️ DBUI" "nvim -c DBUI"
