git:
  # If true, do not spawn a separate process when using GPG
  overrideGpg: true
  pagers:
    - colorArg: always
      pager: delta --paging=never --side-by-side --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      # [Off while testing]
      # pager: delta --no-gitconfig --paging=never --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}" --navigate --line-numbers --features=catppuccin-mocha
gui:
  nerdFontsVersion: "3"
  sidePanelWidth: 0.2
  theme:
    activeBorderColor:
      - '#f5a97f'
      - bold
    inactiveBorderColor:
      - '#a5adcb'
    optionsTextColor:
      - '#8aadf4'
    selectedLineBgColor:
      - '#363a4f'
    cherryPickedCommitBgColor:
      - '#494d64'
    cherryPickedCommitFgColor:
      - '#f5a97f'
    unstagedChangesColor:
      - '#ed8796'
    defaultFgColor:
      - '#cad3f5'
    searchingActiveBorderColor:
      - '#eed49f'
  authorColors:
    '*': '#b7bdf8'
customCommands:
  - key: "c"
    context: "localBranches"
    description: "Create worktree"
    prompts:
      - type: "menu"
        title: "Create"
        key: "Action"
        options:
          - key: "w"
            value: "create-local"
            name: "Create worktree from local branch"
    command: "~/scripts/lazygit_worktree_branch_action {{.Form.Action}} {{.SelectedLocalBranch.Name | quote}}"
    loadingText: "Creating worktree..."
    output: "log"
  - key: "c"
    context: "remoteBranches"
    description: "Create worktree"
    prompts:
      - type: "menu"
        title: "Create"
        key: "Action"
        options:
          - key: "w"
            value: "create-remote"
            name: "Create worktree from remote branch"
    command: "~/scripts/lazygit_worktree_branch_action {{.Form.Action}} {{.SelectedRemoteBranch.Name | quote}} {{.SelectedRemoteBranch.RemoteName | quote}} {{.SelectedRemoteBranch.Name | quote}}"
    loadingText: "Creating worktree..."
    output: "log"
  - key: "d"
    context: "localBranches"
    description: "Delete branch or worktree"
    prompts:
      - type: "menu"
        title: "Delete"
        key: "Action"
        options:
          - key: "c"
            value: "delete-local"
            name: "Delete local branch"
          - key: "r"
            value: "delete-remote"
            name: "Delete remote branch"
          - key: "b"
            value: "delete-both"
            name: "Delete local and remote branch"
          - key: "l"
            value: "delete-local-worktree"
            name: "Delete local branch and worktree"
          - key: "w"
            value: "delete-remote-worktree"
            name: "Delete remote branch and worktree"
          - key: "a"
            value: "delete-all-worktree"
            name: "Delete local and remote branch and worktree"
      - type: "confirm"
        title: "Confirm deletion"
        key: "Confirm"
        body: "Delete the selected branch and requested worktree?"
    command: "~/scripts/lazygit_worktree_branch_action {{.Form.Action}} {{.SelectedLocalBranch.Name | quote}} {{.SelectedLocalBranch.UpstreamRemote | quote}} {{.SelectedLocalBranch.UpstreamBranch | quote}}"
    loadingText: "Deleting branch or worktree..."
    output: "log"
  - key: "d"
    context: "remoteBranches"
    description: "Delete branch or worktree"
    prompts:
      - type: "menu"
        title: "Delete"
        key: "Action"
        options:
          - key: "r"
            value: "delete-remote"
            name: "Delete remote branch"
          - key: "l"
            value: "delete-local-worktree"
            name: "Delete local branch and worktree"
          - key: "w"
            value: "delete-remote-worktree"
            name: "Delete remote branch and worktree"
          - key: "a"
            value: "delete-all-worktree"
            name: "Delete local and remote branch and worktree"
      - type: "confirm"
        title: "Confirm deletion"
        key: "Confirm"
        body: "Delete the selected branch and requested worktree?"
    command: "~/scripts/lazygit_worktree_branch_action {{.Form.Action}} {{.SelectedRemoteBranch.Name | quote}} {{.SelectedRemoteBranch.RemoteName | quote}} {{.SelectedRemoteBranch.Name | quote}}"
    loadingText: "Deleting branch or worktree..."
    output: "log"
  - key: "V"
    context: "commits"
    description: "Release: bump & tag selected commit with changelog"
    prompts:
      - type: "menu"
        title: "Select version bump"
        key: "bump"
        options:
          - value: "patch"
            name: "patch   - bugfixes / tiny changes"
          - value: "minor"
            name: "minor   - new features, backwards compatible"
          - value: "major"
            name: "major   - breaking changes"
    command: "create_new_git_tag_with_release_notes {{.Form.bump}} {{.SelectedLocalCommit.Sha}}"
    loadingText: "Creating tag with changelog..."
  - key: "V"
    context: "commits"
    description: "Release: bump & tag selected commit with changelog"
    prompts:
      - type: "menu"
        title: "Select version bump"
        key: "bump"
        options:
          - value: "patch"
            name: "patch   - bugfixes / tiny changes"
          - value: "minor"
            name: "minor   - new features, backwards compatible"
          - value: "major"
            name: "major   - breaking changes"
    command: "create_new_git_tag_with_release_notes_for_dotfiles {{.Form.bump}} {{.SelectedLocalCommit.Sha}}"
    loadingText: "Creating tag with changelog..."
  - key: "T"
    context: "commits"
    description: "Release: bump & tag selected commit with changelog"
    prompts:
      - type: "menu"
        title: "Select version bump"
        key: "bump"
        options:
          - value: "patch"
            name: "patch   - bugfixes / tiny changes"
          - value: "minor"
            name: "minor   - new features, backwards compatible"
          - value: "major"
            name: "major   - breaking changes"
    command: "create_new_git_tag_with_release_notes {{.Form.bump}} {{.SelectedLocalCommit.Sha}} --push"
    loadingText: "Creating tag with changelog..."
  - key: "T"
    context: "commits"
    description: "Release: bump & tag selected commit with changelog"
    prompts:
      - type: "menu"
        title: "Select version bump"
        key: "bump"
        options:
          - value: "patch"
            name: "patch   - bugfixes / tiny changes"
          - value: "minor"
            name: "minor   - new features, backwards compatible"
          - value: "major"
            name: "major   - breaking changes"
    command: "create_new_git_tag_with_release_notes_for_dotfiles {{.Form.bump}} {{.SelectedLocalCommit.Sha}} --push"
    loadingText: "Creating tag with changelog..."
  - key: "R"
    context: "tags"
    description: "Release: create GitHub release for tag"
    command: "~/scripts/create_new_github_release {{.SelectedTag.Name}}"
    loadingText: "Creating GitHub release..."
    output: terminal
